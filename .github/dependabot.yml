version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: monthly
  groups:
    maven:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
    - dependency-name: "org.apache.maven:maven-artifact"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-core"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-model"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-model-builder"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-plugin-api"
      versions: [">= 3.10.0"]
    # mrm-maven-plugin 2.x needs Java 17 to run, and the build still runs on JDK 8
    - dependency-name: "org.codehaus.mojo:mrm-maven-plugin"
      versions: [">= 2.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
